# One domain for site + API keeps cookies same-site (no CORS or third-party-cookie problems).
server {
  listen 80;
  server_name school.example.com;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name school.example.com;
  # certbot --nginx -d school.example.com   (adds the ssl_certificate lines)

  root /srv/saheemos/client/dist;
  index index.html;
  client_max_body_size 6m;

  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { try_files $uri /index.html; }
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
